<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
  <title id="title">Archivexus — Living Campaign Archive</title>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0B1329"/><stop offset="40%" stop-color="#111C38"/><stop offset="100%" stop-color="#080A14"/></linearGradient><linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#4FACFE"/></linearGradient><linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE066"/><stop offset="50%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient><linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#7E22CE"/></linearGradient><filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/><circle cx="1200" cy="450" r="320" fill="#00F2FE" opacity=".07" filter="url(#cyan-glow)"/><circle cx="1200" cy="450" r="150" fill="#7E22CE" opacity=".14"/>
  <g transform="translate(120 180)" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><text fill="#FFF" font-size="72" font-weight="900" letter-spacing="10">ARCHIVEXUS</text><text y="70" fill="#00F2FE" font-size="23" font-weight="700" letter-spacing="4">LIVING CAMPAIGN ARCHIVE</text><text y="185" fill="#F59E0B" font-family="Georgia, serif" font-size="37" font-style="italic">Every world has a memory.</text><text y="232" fill="#F59E0B" font-family="Georgia, serif" font-size="37" font-style="italic">Archivexus preserves it.</text><text y="330" fill="#94A3B8" font-size="25"><tspan x="0">Build living worlds where characters,</tspan><tspan x="0" dy="38">locations, lore and timelines remain</tspan><tspan x="0" dy="38">connected forever.</tspan></text><rect y="485" width="255" height="62" rx="12" fill="url(#cyan)"/><text x="128" y="525" fill="#04060A" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">ENTER THE ARCHIVE</text></g>
  <g transform="translate(890 140) scale(3.1)"><polygon points="100,12 176.2,56 176.2,144 100,188 23.8,144 23.8,56" fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-dasharray="10 6" opacity=".75"/><g fill="#00F2FE" filter="url(#cyan-glow)"><circle cx="100" cy="12" r="4"/><circle cx="176.2" cy="56" r="4"/><circle cx="176.2" cy="144" r="4"/><circle cx="100" cy="188" r="4"/><circle cx="23.8" cy="144" r="4"/><circle cx="23.8" cy="56" r="4"/></g><ellipse cx="100" cy="100" rx="76" ry="26" fill="none" stroke="url(#violet)" stroke-width="2" transform="rotate(-28 100 100)" opacity=".85"/><ellipse cx="100" cy="100" rx="76" ry="26" fill="none" stroke="url(#cyan)" stroke-width="2" transform="rotate(32 100 100)"/><circle cx="42" cy="72" r="3.5" fill="#C084FC" filter="url(#cyan-glow)"/><circle cx="158" cy="128" r="3.5" fill="#C084FC" filter="url(#cyan-glow)"/><circle cx="142" cy="62" r="4" fill="#00F2FE" filter="url(#cyan-glow)"/><circle cx="58" cy="138" r="3" fill="#00F2FE"/><path d="M100 36V12M100 164v24" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2 3" opacity=".8"/><path d="m138 100 38.2 44M62 100 23.8 56" fill="none" stroke="#C084FC" stroke-width="1" opacity=".4"/><g filter="url(#gold-glow)"><polygon points="100,36 138,100 100,92" fill="url(#gold)" opacity=".95"/><polygon points="100,36 62,100 100,92" fill="url(#gold)" opacity=".75"/><polygon points="100,164 138,100 100,108" fill="url(#gold)" opacity=".85"/><polygon points="100,164 62,100 100,108" fill="url(#gold)" opacity=".65"/><polygon points="100,92 138,100 100,108 62,100" fill="#FFF2B2" opacity=".65"/></g><circle cx="100" cy="100" r="6" fill="#FFF" filter="url(#gold-glow)"/><circle cx="100" cy="100" r="3" fill="#F59E0B"/></g>
</svg>

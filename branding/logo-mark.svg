<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">Archivexus logo mark</title>
  <defs>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE"/><stop offset="100%" stop-color="#4FACFE"/></linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE066"/><stop offset="50%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#7E22CE"/></linearGradient>
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <polygon points="100,12 176.2,56 176.2,144 100,188 23.8,144 23.8,56" fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-dasharray="10 6" opacity=".75"/>
  <g fill="#00F2FE" filter="url(#cyan-glow)"><circle cx="100" cy="12" r="4"/><circle cx="176.2" cy="56" r="4"/><circle cx="176.2" cy="144" r="4"/><circle cx="100" cy="188" r="4"/><circle cx="23.8" cy="144" r="4"/><circle cx="23.8" cy="56" r="4"/></g>
  <ellipse cx="100" cy="100" rx="76" ry="26" fill="none" stroke="url(#violet)" stroke-width="2" transform="rotate(-28 100 100)" opacity=".85"/>
  <ellipse cx="100" cy="100" rx="76" ry="26" fill="none" stroke="url(#cyan)" stroke-width="2" transform="rotate(32 100 100)"/>
  <circle cx="42" cy="72" r="3.5" fill="#C084FC" filter="url(#cyan-glow)"/><circle cx="158" cy="128" r="3.5" fill="#C084FC" filter="url(#cyan-glow)"/><circle cx="142" cy="62" r="4" fill="#00F2FE" filter="url(#cyan-glow)"/><circle cx="58" cy="138" r="3" fill="#00F2FE"/>
  <path d="M100 36V12M100 164v24M138 100l38.2 44M62 100 23.8 56" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2 3" opacity=".8"/>
  <g filter="url(#gold-glow)"><polygon points="100,36 138,100 100,92" fill="url(#gold)" opacity=".95"/><polygon points="100,36 62,100 100,92" fill="url(#gold)" opacity=".75"/><polygon points="100,164 138,100 100,108" fill="url(#gold)" opacity=".85"/><polygon points="100,164 62,100 100,108" fill="url(#gold)" opacity=".65"/><polygon points="100,92 138,100 100,108 62,100" fill="#FFF2B2" opacity=".65"/></g>
  <circle cx="100" cy="100" r="6" fill="#FFF" filter="url(#gold-glow)"/><circle cx="100" cy="100" r="3" fill="#F59E0B"/>
</svg>
